<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编码助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        h1 {
            text-align: center;
            padding: 20px;
            background: #4a5568;
            color: white;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #f7fafc;
            border: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .tab:hover {
            background: #edf2f7;
        }
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2d3748;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            min-height: 150px;
            font-family: 'Consolas', monospace;
        }
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button.submit-btn:hover {
            background: #5a67d8;
        }
        button.submit-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        .result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Consolas', monospace;
            font-size: 13px;
        }
        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>编码助手</h1>
        <div class="tabs">
            <button class="tab active" data-tab="generate">代码生成</button>
            <button class="tab" data-tab="explain">代码解释</button>
            <button class="tab" data-tab="fix">代码改错</button>
        </div>
        
        <!-- 代码生成 -->
        <div class="tab-content active" id="generate">
            <div class="form-group">
                <label>编程语言</label>
                <select id="language">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                </select>
            </div>
            <div class="form-group">
                <label>需求描述</label>
                <textarea id="generate-prompt" placeholder="描述你想要实现的代码功能..."></textarea>
            </div>
            <button class="submit-btn" onclick="handleGenerate()">生成代码</button>
            <div class="result" id="generate-result" style="display:none;"></div>
        </div>
        
        <!-- 代码解释 -->
        <div class="tab-content" id="explain">
            <div class="form-group">
                <label>待解释代码</label>
                <textarea id="explain-code" placeholder="粘贴需要解释的代码..."></textarea>
            </div>
            <button class="submit-btn" onclick="handleExplain()">解释代码</button>
            <div class="result" id="explain-result" style="display:none;"></div>
        </div>
        
        <!-- 代码改错 -->
        <div class="tab-content" id="fix">
            <div class="form-group">
                <label>待修复代码</label>
                <textarea id="fix-code" placeholder="粘贴需要修复的代码..."></textarea>
            </div>
            <div class="form-group">
                <label>错误信息（可选）</label>
                <textarea id="fix-error" placeholder="描述遇到的错误..." style="min-height:80px;"></textarea>
            </div>
            <button class="submit-btn" onclick="handleFix()">修复代码</button>
            <div class="result" id="fix-result" style="display:none;"></div>
        </div>
    </div>

    <script>
        // 标签页切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        async function handleGenerate() {
            const prompt = document.getElementById('generate-prompt').value;
            const language = document.getElementById('language').value;
            const resultDiv = document.getElementById('generate-result');
            
            if (!prompt) {
                alert('请输入需求描述');
                return;
            }
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading">处理中...</div>';
            
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt, language})
            });
            const data = await response.json();
            resultDiv.innerHTML = '<pre>' + data.result + '</pre>';
        }

        async function handleExplain() {
            const code = document.getElementById('explain-code').value;
            const resultDiv = document.getElementById('explain-result');
            
            if (!code) {
                alert('请输入代码');
                return;
            }
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading">处理中...</div>';
            
            const response = await fetch('/api/explain', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code})
            });
            const data = await response.json();
            resultDiv.innerHTML = '<pre>' + data.result + '</pre>';
        }

        async function handleFix() {
            const code = document.getElementById('fix-code').value;
            const error = document.getElementById('fix-error').value;
            const resultDiv = document.getElementById('fix-result');
            
            if (!code) {
                alert('请输入代码');
                return;
            }
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading">处理中...</div>';
            
            const response = await fetch('/api/fix', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code, error})
            });
            const data = await response.json();
            resultDiv.innerHTML = '<pre>' + data.result + '</pre>';
        }
    </script>
</body>
</html>
